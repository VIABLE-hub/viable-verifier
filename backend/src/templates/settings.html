{% extends "base.html" %} 
{% block title %}Einstellungen{% endblock %} 

<!-- CSRF Token for API calls -->
<meta name="csrf-token" content="{{ session.csrf_token or '' }}">

{% block content %}
  <!-- Settings JavaScript - Modular System (HERZCHIRURG Working Version) -->
  <script src="/static/js/settings.js"></script>

<!-- Settings Component - Main Container -->
<div x-data="settings" x-init="init()" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- Header -->
    <div class="mb-8">
        <h1 class="text-3xl font-bold text-gray-900 dark:text-white">Einstellungen</h1>
        <p class="mt-2 text-sm text-gray-600 dark:text-gray-400">
            Konfigurieren Sie Ihre StudentVC-Instanz und passen Sie sie an Ihre Bedürfnisse an.
        </p>
    </div>
    
    <!-- Tab Navigation -->
    <div class="mb-4 border-b border-gray-200 dark:border-gray-700">
        <ul class="flex flex-wrap -mb-px text-sm font-medium text-center">
            <li class="mr-2">
                <a href="#" 
                   @click.prevent="switchToTab('network')"
                   :class="{'inline-block p-4 text-berlin-blue border-b-2 border-berlin-blue rounded-t-lg active dark:text-berlin-blue dark:border-berlin-blue': activeTab === 'network', 'inline-block p-4 border-b-2 border-transparent rounded-t-lg hover:text-gray-600 hover:border-gray-300 dark:hover:text-gray-300': activeTab !== 'network'}">
                    <svg class="w-5 h-5 mr-2 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path>
                    </svg>
                    Network
                </a>
            </li>
            <!-- Database Tab removed -->
            <!-- System Tab removed -->
            <!-- API Tab removed -->
            <!-- Keys Tab removed -->
            <!-- Selective Disclosure Tab removed -->
        </ul>
    </div>
    
    <!-- Tab Content -->
    <div class="py-6 px-4 sm:px-6">
        <!-- Network Tab -->
        <div x-show="activeTab === 'network'" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 transform scale-95" x-transition:enter-end="opacity-100 transform scale-100">
            {% include 'settings/tab_network.html' %}
        </div>
        
        <!-- API Tab removed -->
        
        <!-- Keys Tab removed -->
        
        <!-- Selective Disclosure Tab removed -->
        
    </div>
</div>

<!-- External Libraries -->
<!-- Swagger UI for API Documentation -->
<link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@4.5.0/swagger-ui.css" />
<script src="https://unpkg.com/swagger-ui-dist@4.5.0/swagger-ui-bundle.js" crossorigin></script>
<script src="https://unpkg.com/swagger-ui-dist@4.5.0/swagger-ui-standalone-preset.js" crossorigin></script>

<!-- Toastify for notifications -->
<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

<!-- Global notification function -->
<script>
  window.showNotification = function(message, type) {
    if (typeof Toastify !== 'undefined') {
      Toastify({
        text: message,
        duration: 5000,
        close: true,
        gravity: "top",
        position: "right",
        backgroundColor: type === 'success' ? "#4CAF50" : 
                        type === 'error' ? "#F44336" : 
                        type === 'warning' ? "#FF9800" : "#2196F3",
        className: "settings-notification"
      }).showToast();
    }
  };
</script>

<!-- Custom Styles -->
<style>
    /* Settings page animations */
    .settings-fade-in {
        animation: fadeIn 0.3s ease-in-out;
    }
    
    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }
    
    /* Swagger UI dark mode fixes */
    .dark .swagger-ui {
        filter: invert(92%) hue-rotate(180deg);
    }
    
    .dark .swagger-ui .opblock-summary-get,
    .dark .swagger-ui .opblock-summary-post,
    .dark .swagger-ui .opblock-summary-put,
    .dark .swagger-ui .opblock-summary-delete,
    .dark .swagger-ui .opblock-summary-patch {
        filter: invert(100%) hue-rotate(180deg);
    }
    
    /* Berlin Blue theme colors */
    .text-berlin-blue {
        color: #003f7f;
    }
    
    .bg-berlin-blue {
        background-color: #003f7f;
    }
    
    .border-berlin-blue {
        border-color: #003f7f;
    }
    
    .hover\:bg-berlin-blue:hover {
        background-color: #003f7f;
    }
</style>


{% endblock %}
